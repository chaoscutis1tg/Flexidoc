services:
  # App chính (Backend Node.js tích hợp Frontend React)
  flexidoc_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flexidoc_app
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=https://flexidoc.io.vn,http://flexidoc.io.vn,https://www.flexidoc.io.vn,http://www.flexidoc.io.vn,http://localhost:5000
      - MONGODB_URI=mongodb://webhopdong_mongodb:27017/mt_ctms
      - JWT_SECRET=mt_ctms_super_secret_jwt_key_2026_change_in_production
      - JWT_EXPIRES_IN=1d
      - SERVER_BASE_URL=https://flexidoc.io.vn
      - SEPAY_WEBHOOK_PATH=/api/v1/payments/sepay-webhook
      - ONLYOFFICE_URL=http://onlyoffice_docs:80
      - ONLYOFFICE_PUBLIC_URL=https://office.flexidoc.io.vn
      - ONLYOFFICE_JWT_SECRET=flexidoc_onlyoffice_secret_2026
    depends_on:
      - webhopdong_mongodb
      - onlyoffice_docs
    volumes:
      - webhopdong_uploads:/app/backend/uploads

  # ONLYOFFICE Document Server — Full DOCX Editor (like Google Docs)
  onlyoffice_docs:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice_docs
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=flexidoc_onlyoffice_secret_2026
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

  # Database MongoDB
  webhopdong_mongodb:
    image: mongo:6.0
    container_name: webhopdong_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - webhopdong_mongo_data:/data/db

volumes:
  webhopdong_mongo_data:
  webhopdong_uploads:
  onlyoffice_data:
  onlyoffice_logs:
