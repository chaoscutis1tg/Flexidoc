version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/flexidoc}
      - JWT_SECRET=${JWT_SECRET:-flexidwt_key_2021326_changezcz@_in_production}
      - JWT_EXPIRES_IN=1d
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:
