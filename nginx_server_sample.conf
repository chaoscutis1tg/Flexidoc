# ==============================================================================
# File cấu hình Nginx dành riêng cho Máy Server (Chuyển tiếp về Máy Local)
# Đặt file này vào Máy Server tại: /etc/nginx/sites-available/flexidoc.conf
# Rồi tạo symlink: sudo ln -s /etc/nginx/sites-available/flexidoc.conf /etc/nginx/sites-enabled/
# Kích hoạt: sudo nginx -t && sudo nginx -s reload
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name flexidoc.io.vn www.flexidoc.io.vn;

    # Tùy chỉnh dung lượng tối đa file tải lên (Hợp đồng, File PDF, Ảnh)
    client_max_body_size 50M;

    # Nginx Proxy chuyển tiếp tới IP máy Local của bạn trên cổng 5000
    # IP LAN Máy Local hiện tại của bạn: 192.168.1.59
    location / {
        proxy_pass http://192.168.1.59:5000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
